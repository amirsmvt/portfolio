server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text files
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1024;

    # Videos (.mov needs its type set by hand)
    location ~* \.mov$ {
        types { }
        default_type video/quicktime;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # .jfif images (type set by hand)
    location ~* \.jfif$ {
        types { }
        default_type image/jpeg;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Cache images, fonts and libraries
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Always fetch the latest HTML/CSS/JS so edits show up straight away
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
